<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F16"/>
      <stop offset="100%" stop-color="#123626"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="55%" stop-color="#E3EF26"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#1F5A3D" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1F5A3D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1B3B29" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1F16" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1F16" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect width="1200" height="380" fill="url(#fade)" opacity="0.35"/>

  <!-- top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#4ADE80" opacity="0.5"/>

  <!-- badge pill -->
  <rect x="360" y="46" width="480" height="30" rx="15" fill="#123626" stroke="#2C5240" stroke-width="1"/>
  <circle cx="382" cy="61" r="4" fill="#4ADE80"/>
  <text x="396" y="66" font-family="Consolas, 'SF Mono', monospace" font-size="12" letter-spacing="1.5" fill="#F2C879" font-weight="600">EXPLAINABLE AI FARM SENTINEL · NON-LETHAL DEFENSE</text>

  <!-- shield icon -->
  <g transform="translate(462,100)">
    <path d="M22 0 L44 8 V26 C44 42 22 52 22 52 C22 52 0 42 0 26 V8 Z" fill="#123626" stroke="#4ADE80" stroke-width="2"/>
    <path d="M14 26 L20 32 L32 18" stroke="#4ADE80" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="600" y="205" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#F4F1E8" text-anchor="middle">Rakshak <tspan fill="#4ADE80">AI</tspan></text>

  <!-- tagline -->
  <text x="600" y="248" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="url(#titleGrad)" text-anchor="middle">Protect Every Harvest. Preserve Every Life.</text>

  <!-- subtext -->
  <text x="600" y="282" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#A9B79E" text-anchor="middle">Observation → Context → Assessment → Decision — a transparent reasoning chain, before crop damage happens.</text>

  <!-- mini status badges -->
  <g font-family="Consolas, 'SF Mono', monospace" font-size="11" font-weight="700">
    <rect x="420" y="312" width="90" height="26" rx="13" fill="#123626" stroke="#2C5240"/>
    <circle cx="436" cy="325" r="4" fill="#4ADE80"/>
    <text x="448" y="329" fill="#9AD4B5">SAFE</text>

    <rect x="522" y="312" width="110" height="26" rx="13" fill="#123626" stroke="#2C5240"/>
    <circle cx="538" cy="325" r="4" fill="#FACC15"/>
    <text x="550" y="329" fill="#EAD98C">CAUTION</text>

    <rect x="644" y="312" width="130" height="26" rx="13" fill="#2A1414" stroke="#5A2323"/>
    <circle cx="660" cy="325" r="4" fill="#EF4444"/>
    <text x="672" y="329" fill="#F3A6A0">HIGH ALERT</text>
  </g>

  <!-- bottom hairline -->
  <rect x="0" y="377" width="1200" height="3" fill="#4ADE80" opacity="0.35"/>
</svg>
